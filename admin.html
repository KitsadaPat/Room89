<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการคำสั่งซื้อ - Room Scent Admin</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">ROOM SCENT (ADMIN)</a>
      <ul class="nav-links">
        <li><a href="index.html">หน้าแรกเว็บ</a></li>
      </ul>
    </div>
  </nav>

  <!-- Admin Orders Dashboard -->
  <main class="admin-page container">
    <header class="page-header">
      <h1>รายการคำสั่งซื้อทั้งหมด</h1>
      <p>ตารางแสดงข้อมูลการสั่งซื้อที่ส่งมาจากระบบสั่งสินค้า</p>
    </header>

    <div class="table-wrapper">
      <table id="ordersTable" class="custom-table">
        <thead>
          <tr>
            <th>วันเวลา</th>
            <th>ชื่อลูกค้า</th>
            <th>เบอร์โทร/Line</th>
            <th>รายการสินค้า</th>
            <th>จำนวนเงินรวม</th>
            <th>หมายเหตุ</th>
          </tr>
        </thead>
        <tbody>
          <!-- script.js จะนำข้อมูลแถวมาใส่ในส่วนนี้ -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Room Scent Management System</p>
    </div>
  </footer>

</body>
</html>
